<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="cadastro"> 
    <header class="Menu">
        <nav class="nav-bar">
            <a href="../index.html" class="box-logo">
                <img src="../IMG/logo 1.webp" alt="logo do site Bike 544"
                id="logo">
            </a>
            <ul class="nav-menu"
                <li class="nav-item">
                    <a href="../index.html" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="cadastro.html" class="nav-link">Cadastro</a>
                </li>
                <li class="nav-item">
                    <a href="contato.html" class="nav-link">Contato</a>
                </li>
                <li class="nav-item">
                    <a href="produtos.html" class="nav-link">Produtos</a>
                </li>
            </ul>
             <a href="login.html"><button class="btn" id="login">LOGIN</button></a>
        </nav>
    </header>
    <div class="box-cadastro">
        <form action="">
            <fieldset>
            <legend><span> Formulario de Clientes </span></legend>
             <div class="area-formulario">

                
                <div class="input-box">
                    <input type="text" name="nome" id="nome" class="InputUser" required>
                    <label for="nome" class="LabelInput">Nome Completo</label>
                </div>
                <div class="input-box">
                    <input type="text" name="email" id="email" class="InputUser" required>
                    <label for="email" class="LabelInput">email</label>
                </div>
                <div class="input-box">
                    <input type="tel" name="telefone" id="telefone" class="InputUser" required>
                    <label for="telefone" class="LabelInput">telefone</label>
                </div>
                <div class="genero">
                    <p>Sexo:</p>
                    <div class="opcao-genero">
                        <input type="radio" name="genero" id="feminino" value="feminino" required>
                        <label for="feminino">feminino</label>
                    </div>
                    <div class="opcao-genero">
                        <input type="radio" name="genero" id="masculino" value="masculino" required>
                        <label for="masculino">masculino</label>
                    </div>
                    <div class="opcao-genero">
                        <input type="radio" name="genero" id="outros" value="outros" required>
                        <label for="outros">outros</label>
                    </div>
                </div>
                <div class="data-nascimento">
                    <label for="data_nascimento">Data de Nascimento</label>
                    <input type="date" name="data_nascimento" id="data_nascimento" required>
                </div>
                <div class="input-box">
                    <input type="text" name="cidade" id="cidade" class="InputUser" required>
                    <label for="cidade" class="LabelInput">cidade</label>
                </div>
                <div class="input-box">
                    <input type="text" name="estado" id="estado" class="InputUser" required>
                    <label for="estado" class="LabelInput">Estado</label>
                </div>
                <div class="input-box">
                    <input type="text" name="endereço" id="endereço" class="InputUser" required>
                    <label for="endereço" class="LabelInput">Endereço</label>
                </div>

            

                <input type="button" value="ENVIAR" name="submit" id="submit">

             </div>

            </fieldset>
        </form>
    </div>
    <footer>
        <div class="footer-itens">
            <span class="copyright">
                &copy 2026 Caio
            </span>
            <div class="social-media-buttons">

                <a href="https://github.com/CaioFarias-jpg" target="_blank"><i class="fa-brands fa-github"></i></a>
                <a href="https://www.instagram.com/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
