<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIKE 544</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="contato">
    <header class="Menu">
        <nav class="nav-bar">
            <a href="../index.html" class="box-logo">
                <img src="../IMG/logo 1.webp" alt="logo do site Bike 544"
                id="logo">
            </a>
            <ul class="nav-menu"
                <li class="nav-item">
                    <a href="../index.html" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="cadastro.html" class="nav-link">Cadastro</a>
                </li>
                <li class="nav-item">
                    <a href="contato.html" class="nav-link">Contato</a>

                <li class="nav-item">
                    <a href="produtos.html" class="nav-link">Produtos</a>
                </li>
            </ul>
             <a href="login.html"><button class="btn" id="login">LOGIN</button></a>
        </nav>
    </header>
    <div class="box-contato">
        <form action="">
            <fieldset>
            <legend><span>Entre em Contato</span></legend>
             <div class="area-contato">
                <div class="input-box">
                    <input type="text" name="nome" id="nome" class="InputUser" required>
                    <label for="nome" class="LabelInput">Nome</label>
                </div>

                <div class="input-box">
                    <input type="text" name="Email" id="Email" class="InputUser" required>
                    <label for="Email" class="LabelInput">Email</label>
                </div>

                <div class="input-box">
                    <input type="text" name="Assunto" id="Assunto" class="InputUser" required>
                    <label for="Assunto" class="LabelInput">Assunto</label>
                </div>

                <div class="input-box">
                    <input type="text" name="Menssagem" id="Menssagem" class="InputUser" required>
                    <label for="Menssagem" class="LabelInput">Menssagem</label>
                </div>

             </div>
            </fieldset>
        </form>

    </div>
</body>
</html>
